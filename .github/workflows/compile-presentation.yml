name: deploy-landing-page

# Only run this when the master branch changes
on:
  push:
    branches:
    - main
  #schedule:
    # hourly run
    #- cron: '*/10 * * * *'
    # daily run
    #- cron: '3 7 * * *'
    # weekly run
    #- cron: '3 7 * * 1'
  workflow_dispatch:
    inputs:
      create_deposit:
        type: boolean
        description: 'Create a Dataverse deposit'
        default: false
      refresh_website:
        type: boolean
        description: 'Refresh the website'
        default: true

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:

  # Build the repo-specific container (R + packages from renv.lock).
  # Layers are cached, so this is fast unless Dockerfile, renv.lock, or libraries.R change.
  build-container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Image name
      id: image
      run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: |
          ${{ steps.image.outputs.image }}
          ghcr.io/${{ github.repository }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  compile-quarto:
    needs: build-container
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.build-container.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Render Landing Page
      env:
        QUARTO_PRINT_STACK: true
      run: |
        quarto render presentation/index.qmd --output-dir _html
    - name: Upload HTML Artifact
      id: artifact-upload-step2
      uses: actions/upload-artifact@v7
      with:
          name: artifact-html
          path: _html/presentation
          retention-days: 1
    - name: Upload data artifact
      id: artifact-upload-data
      if: ${{ github.event.inputs.create_deposit == 'true' }}
      uses: actions/upload-artifact@v7
      with:
          name: artifact-data
          path: data
          retention-days: 1

     


  # Companion book (Jupyter Book 2 / mystmd); book/build.sh runs directly in this container
  compile-book:
    runs-on: ubuntu-24.04
    container: node:22
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build the book
      env:
        BASE_URL: /${{ github.event.repository.name }}
        IN_CONTAINER: "1"
      run: ./book/build.sh

    - name: Upload Book Artifact
      uses: actions/upload-artifact@v7
      with:
          name: artifact-book
          path: book/_build/html
          retention-days: 1

    # now make a PDF out of it
  create-pdf:
    needs: compile-quarto
    runs-on: ubuntu-24.04
    steps:
    - name: Download quarto artifact
      uses: actions/download-artifact@v8
      with:
        name: artifact-html
        path: _html
    - name: Check permissions
      run: |
        ls -la _html
        chmod -R a+rwX _html
        ls -la _html
  
    - name: Create PDF
      uses: addnab/docker-run-action@v3
      with:
        image: astefanutti/decktape
        options: -v ${{ github.workspace }}/_html:/slides 
        run: |
          node /decktape/decktape.js --chrome-path /usr/bin/chromium-browser --chrome-arg=--no-sandbox --chrome-arg=--disable-gpu index.html index.pdf

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: artifact-presentation-pdf
        path: _html/index.pdf
  deploy-all:
    runs-on: ubuntu-24.04
    needs:
      - compile-quarto
      - compile-book
      - create-pdf
    if: ${{ github.event.inputs.refresh_website == 'true' || github.event_name == 'push' }}
    steps:
    # Pull down all artifacts

    - name: Download Book Artifact
      uses: actions/download-artifact@v8
      with:
            path: .
            pattern: artifact-book
    - name: Download HTML Artifacts
      uses: actions/download-artifact@v8
      with:
            path: .
            pattern: artifact-html
    - name: Download Pres PDF
      uses: actions/download-artifact@v8
      with:
            path: .
            pattern: artifact-presentation-pdf
   # Book at the site root, slides (and PDF) under /presentation/
    - name: Move stuff
      run: |
          set -ev
          ls -lR
          mv artifact-book website
          mv artifact-html website/presentation
          mv artifact-presentation-pdf/index.pdf website/presentation/presentation.pdf
    # Prepare the GitHub Pages action
    - name: prepare GitHub Pages action
      uses: actions/upload-pages-artifact@v5    
      with:
        path: ./website
  
  publish:
    needs: deploy-all
    if: ${{ github.event.inputs.refresh_website == 'true' || github.event_name == 'push' }}
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    # environment:
    #   name: github-pages
    #   url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5 
  preserve:
    needs: compile-quarto
    runs-on: ubuntu-24.04
    if: ${{ github.event.inputs.create_deposit == 'true' }}
    steps:
    - name: Download quarto artifact
      uses: actions/download-artifact@v8
      with:
        name: artifact-data
        path: data
    - name: Send data to Dataverse 
      uses: larsvilhuber/dataverse-uploader@v1.7.2
      with:
        DATAVERSE_TOKEN: ${{secrets.DATAVERSE_TOKEN}}
        DATAVERSE_SERVER: ${{secrets.DATAVERSE_SERVER}}
        DATAVERSE_DATASET_DOI: ${{secrets.DATAVERSE_DATASET_DOI}}
        GITHUB_DIR: data
        DELETE: True
        PUBLISH: False
        